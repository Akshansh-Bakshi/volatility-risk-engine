[pytest]
minversion = 8.0
testpaths = tests
# Make the repository root importable so tests can `import src`.
pythonpath = .
addopts = -ra --strict-markers --strict-config -m "not live"
markers =
    live: integration checks that need network access to Yahoo Finance (run with `-m live`)
filterwarnings =
    ignore::pytest.PytestCollectionWarning
